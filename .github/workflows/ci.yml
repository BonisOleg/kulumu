name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install ruff black djlint

      - name: Run ruff
        run: ruff check .

      - name: Run black (check mode)
        run: black --check .

      - name: Run djlint
        run: djlint templates/ --profile django

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kylymy_test
          POSTGRES_USER: kylymy
          POSTGRES_PASSWORD: kylymy
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements/dev.txt

      - name: Run tests
        env:
          SECRET_KEY: test-secret-key-for-ci-only
          DATABASE_URL: postgres://kylymy:kylymy@localhost:5432/kylymy_test
          REDIS_URL: redis://localhost:6379/0
          DEBUG: "False"
          DJANGO_SETTINGS_MODULE: kylymy.settings.dev
        run: |
          pytest --tb=short

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: success()
        with:
          file: ./coverage.xml
