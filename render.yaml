# Render Blueprint — https://render.com/docs/blueprint-spec
# New → Blueprint → вибери репозиторій. Плани та регіон підлаштуй під акаунт.

databases:
  - name: kylymy-database
    databaseName: kylymy
    user: kylymy
    region: frankfurt
    plan: basic-256mb

services:
  - type: keyvalue
    name: kylymy-cache
    region: frankfurt
    plan: free
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

  - type: web
    name: kylymy-web
    runtime: python
    region: frankfurt
    plan: starter
    buildCommand: bash scripts/render_build.sh
    startCommand: gunicorn kylymy.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DJANGO_SETTINGS_MODULE
        value: kylymy.settings.prod
      - key: SECRET_KEY
        generateValue: true
      - key: SITE_URL
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: kylymy-database
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: kylymy-cache
          property: connectionString
