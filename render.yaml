# Render Blueprint — https://render.com/docs/blueprint-spec
# New → Blueprint → вибери репозиторій. Плани та регіон підлаштуй під акаунт.

databases:
  - name: kylymy-database
    databaseName: kylymy
    user: kylymy
    region: frankfurt
    plan: basic-256mb

services:
  - type: keyvalue
    name: kylymy-cache
    region: frankfurt
    plan: free
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

  - type: web
    name: kylymy-web
    runtime: python
    region: frankfurt
    plan: starter
    buildCommand: bash scripts/render_build.sh
    startCommand: gunicorn kylymy.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120 --error-logfile - --access-logfile - --log-level info
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DJANGO_SETTINGS_MODULE
        value: kylymy.settings.prod
      - key: SECRET_KEY
        generateValue: true
      - key: SITE_URL
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false

      # Database & Cache
      - key: DATABASE_URL
        fromDatabase:
          name: kylymy-database
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: kylymy-cache
          property: connectionString

      # Media (Cloudinary — опційно; без змінної використовується файлова система)
      - key: CLOUDINARY_URL
        sync: false

      # Email
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: noreply@kylymy.ua
      - key: ADMIN_EMAIL
        sync: false

      # Telegram
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ADMIN_CHAT_ID
        sync: false

      # Nova Poshta
      - key: NOVA_POSHTA_API_KEY
        sync: false

      # LiqPay
      - key: LIQPAY_PUBLIC_KEY
        sync: false
      - key: LIQPAY_PRIVATE_KEY
        sync: false

      # WayForPay
      - key: WAYFORPAY_MERCHANT_ACCOUNT
        sync: false
      - key: WAYFORPAY_MERCHANT_SECRET
        sync: false

      # Sentry
      - key: SENTRY_DSN
        sync: false
